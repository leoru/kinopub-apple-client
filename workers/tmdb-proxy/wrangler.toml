name = "kinopub-tmdb-proxy"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

# Set with: wrangler secret put TMDB_READ_TOKEN
# Optional override: vars.TMDB_API_BASE = "https://api.themoviedb.org"

[vars]
CACHE_TTL_SECONDS = "21600"

# Documents keyed by kino.pub id. Create once, then paste the id here:
#   npx wrangler kv namespace create DOCUMENTS
# Until it is bound the worker still answers — /v1/title returns a hints-only
# document and /img falls back to kino.pub artwork — it just stores nothing.
# [[kv_namespaces]]
# binding = "DOCUMENTS"
# id = "<paste from the create command>"
