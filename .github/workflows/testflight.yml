# Internal TestFlight — iOS, tvOS, macOS of the one multiplatform target.
#
# Not a public beta and not an App Store submission. Testers who are App Store
# Connect Users on this app get the build after Apple processes it. Optional
# named internal groups: set the TESTFLIGHT_INTERNAL_GROUPS repository variable
# to a comma-separated list of group names (the job then waits for processing
# so it can assign them).
#
# Trigger: Actions → TestFlight → Run workflow. Pick a platform or "all".
#
# ── One-time Apple setup ────────────────────────────────────────────────────
# 1. Developer Portal: the App ID `com.soda.kinopub` (team Z2PQ733PSP) must
#    exist. A local Xcode run with Automatic signing creates it. Enable iOS,
#    tvOS and macOS on that App ID.
# 2. App Store Connect → Apps → (+): iOS app named "Kinopub Soda", bundle id
#    `com.soda.kinopub`. Then add Apple TV and Mac on the same record so one
#    TestFlight link covers every device (universal purchase).
# 3. Users and Access → Integrations → App Store Connect API: create a key
#    with App Manager (or Admin). Download the .p8; you cannot re-download it.
# 4. Xcode → Settings → Accounts → Manage Certificates: create "Apple
#    Distribution" if you do not already have one. Export it from Keychain
#    Access as a .p12. For Mac TestFlight also export "Mac Installer
#    Distribution" as a second .p12.
# 5. Add testers under Users and Access (they land in Internal Testing as
#    App Store Connect Users) or create an Internal group on the app.
#
# ── GitHub secrets (Settings → Secrets and variables → Actions) ─────────────
#   APP_STORE_CONNECT_API_KEY_ID            key id, e.g. ABCD123456
#   APP_STORE_CONNECT_ISSUER_ID             issuer UUID from the API keys page
#   APP_STORE_CONNECT_API_KEY_CONTENT       base64 of the .p8, or the PEM itself
#   BUILD_CERTIFICATE_BASE64                base64 of the Apple Distribution .p12
#   P12_PASSWORD                            password of that .p12
#   MAC_INSTALLER_CERTIFICATE_BASE64        base64 of the Mac Installer .p12
#                                           (required only for macos / all)
#   MAC_INSTALLER_CERTIFICATE_PASSWORD      password of that .p12
#
# Encode a file:  base64 -i AuthKey_XXX.p8 | pbcopy
#
# Optional repository variable (not a secret):
#   TESTFLIGHT_INTERNAL_GROUPS              comma-separated internal group names
#
# Signing is a persistent p12 (same idea as Swiftfin / Rivulet's
# CERTIFICATE_PRIVATE_KEY). Do not mint a new distribution cert per run —
# Apple caps those and a CI runner will hit the cap.

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to upload
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - tvos
          - macos
      changelog:
        description: What to Test (git log of the last 15 commits if empty)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  prepare:
    name: Reserve build number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.reserve.outputs.build_number }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve platform matrix
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            ios)   matrix='{"include":[{"platform":"ios"}]}' ;;
            tvos)  matrix='{"include":[{"platform":"tvos"}]}' ;;
            macos) matrix='{"include":[{"platform":"macos"}]}' ;;
            all)   matrix='{"include":[{"platform":"ios"},{"platform":"tvos"},{"platform":"macos"}]}' ;;
            *)
              echo "::error::Unknown platform '$PLATFORM'"
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Platform matrix: $matrix"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "4.0.19"
          bundler-cache: true

      - name: Reserve the next shared build number
        id: reserve
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: BUILD_NUMBERS_FILE="$GITHUB_OUTPUT" bundle exec fastlane ios reserve_build_number

  upload:
    name: Upload ${{ matrix.platform }}
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
      MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
      TESTFLIGHT_INTERNAL_GROUPS: ${{ vars.TESTFLIGHT_INTERNAL_GROUPS }}
      TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
      TESTFLIGHT_PLATFORM: ${{ matrix.platform }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: .github/scripts/select-xcode-26.sh

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "bundled with this Xcode"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "4.0.19"
          bundler-cache: true

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
