name: CI

# macos-26 jobs are gated by path filters, not a blanket paths-ignore:
# Fastlane / docs / TestFlight yaml → nothing. xcassets / xcstrings →
# compile only (a broken catalog still fails xcodebuild). Swift / pbxproj
# → compile + UI tests. `workflow_dispatch` still runs everything.

on:
  push:
    # Agent branches too, not only main: nothing else compiles them. A player change sat
    # on `claude/**` and broke iOS *and* tvOS in ways only xcodebuild could see, because a
    # branch push ran no job at all and no PR was open yet. Ordinary feature branches keep
    # getting their run from `pull_request`.
    branches: [main, 'claude/**', 'cursor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.out.outputs.compile }}
      test_app: ${{ steps.out.outputs.test_app }}
      packages: ${{ steps.out.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'

      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            compile:
              - 'KinoPubAppleClient/**'
              - 'Packages/**'
              - 'KinoPubAppleClient.xcodeproj/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            test_app:
              - 'KinoPubAppleClient/**/*.swift'
              - 'KinoPubAppleClient/**/*.plist'
              - 'KinoPubAppleClient/**/*.metal'
              - 'KinoPubAppleClient.xcodeproj/**'
              - 'Packages/**/*.swift'
              - 'Packages/**/*.metal'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            packages:
              - 'Packages/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

      - id: out
        env:
          EVENT: ${{ github.event_name }}
          COMPILE: ${{ steps.filter.outputs.compile }}
          TEST_APP: ${{ steps.filter.outputs.test_app }}
          PACKAGES: ${{ steps.filter.outputs.packages }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
            echo "test_app=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "compile=${COMPILE:-false}" >> "$GITHUB_OUTPUT"
            echo "test_app=${TEST_APP:-false}" >> "$GITHUB_OUTPUT"
            echo "packages=${PACKAGES:-false}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: filter
    if: needs.filter.outputs.compile == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: tvOS
            destination: 'generic/platform=tvOS Simulator'
          - platform: iOS
            destination: 'generic/platform=iOS Simulator'
          - platform: macOS
            destination: 'platform=macOS'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: .github/scripts/select-xcode-26.sh

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | sed -n '1,40p'

      # KinoPubUI contains a .metal shader. Xcode 26+ moved the Metal toolchain out
      # into a separate downloadable component; earlier Xcodes bundle it, so this is
      # a no-op there and a real download on newer runner images.
      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "bundled with this Xcode"

      # Failures are echoed back as ::error:: so they show up as annotations. Job
      # logs need admin rights to read, annotations do not.
      - name: xcodebuild
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project KinoPubAppleClient.xcodeproj \
            -scheme KinoPubAppleClient \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build.log
          then
            grep -E "error:|error " /tmp/build.log | sort -u | head -15 | while IFS= read -r line; do
              echo "::error::${{ matrix.platform }}: ${line}"
            done
            exit 1
          fi

  # Separate from the compile jobs on purpose: this one boots a simulator and installs the
  # app, so it is minutes rather than seconds. Compile stays on every *app* change —
  # that is what catches a symbol fenced to one platform and used on another.
  test-app:
    name: Test app (${{ matrix.platform }})
    needs: filter
    if: needs.filter.outputs.test_app == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: tvOS
            runtime: SimRuntime.tvOS
          - platform: iOS
            runtime: SimRuntime.iOS
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: .github/scripts/select-xcode-26.sh

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "bundled with this Xcode"

      # By udid, not by name: runner images rename and renumber their devices, and a
      # hard-coded "Apple TV 4K (3rd generation)" is a job that dies on an image refresh.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices):
              if '${{ matrix.runtime }}' in runtime and devices[runtime]:
                  print(devices[runtime][0]['udid'])
                  break
          ")
          if [ -z "$UDID" ]; then
            echo "::error::No ${{ matrix.platform }} simulator on this runner image"
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Using $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: xcodebuild test
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project KinoPubAppleClient.xcodeproj \
            -scheme KinoPubAppleClient \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/test-app.log
          then
            grep -E "error:|error |failed|XCTAssert" /tmp/test-app.log | sort -u | head -15 | while IFS= read -r line; do
              echo "::error::${{ matrix.platform }}: ${line}"
            done
            exit 1
          fi

  test-packages:
    name: Test ${{ matrix.package }}
    needs: filter
    if: needs.filter.outputs.packages == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [KinoPubKit, KinoPubUI, KinoPubBackend, KinoPubLogging]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: .github/scripts/select-xcode-26.sh

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # KinoPubUI's shader is compiled by `swift test` too, so this job needs the
      # toolchain just as much as the build jobs do.
      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "bundled with this Xcode"

      - name: swift test
        run: |
          set -o pipefail
          if ! swift test --package-path Packages/${{ matrix.package }} 2>&1 | tee /tmp/test.log
          then
            grep -E "error:|error " /tmp/test.log | sort -u | head -15 | while IFS= read -r line; do
              echo "::error::${{ matrix.package }}: ${line}"
            done
            exit 1
          fi
