name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: tvOS
            destination: 'generic/platform=tvOS Simulator'
          - platform: iOS
            destination: 'generic/platform=iOS Simulator'
    steps:
      - uses: actions/checkout@v4

      - name: xcodebuild
        run: |
          set -o pipefail
          xcodebuild \
            -project KinoPubAppleClient.xcodeproj \
            -scheme KinoPubAppleClient \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

  test-packages:
    name: Test ${{ matrix.package }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # KinoPubKit and KinoPubUI are excluded on purpose — their test targets do
        # not currently compile standalone. See "Known issues" in the README.
        package: [KinoPubBackend, KinoPubLogging]
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        run: swift test --package-path Packages/${{ matrix.package }}
